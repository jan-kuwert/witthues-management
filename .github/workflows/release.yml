# Builds Witthüs on a GitHub-hosted Mac and publishes it as release vN (N = previous release + 1).
# The app's updater reads the newest release and downloads Witthues.zip; Witthüs.dmg is for installing by hand.
# Free for public repositories. Runs only when started by hand (Actions → Release → Run workflow, or
# `gh workflow run release.yml`), so several pushes can go into one version.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Choose Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $XCODE"

      - name: Signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "::warning::No SIGNING_P12 secret (see Witthues/make-signing-key.sh): ad-hoc signature, macOS asks for keychain access after the update."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$SIGNING_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P witthues -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC" >/dev/null
          ID=$(security find-identity -p codesigning "$KC" | awk '/"Witthues Signing"/{print $2; exit}')
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "Signing with $ID"

      - name: Next version
        id: version
        run: |
          LAST=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          echo "last=${LAST:-}" >> "$GITHUB_OUTPUT"
          echo "next=$(( ${LAST:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: Witthues
        run: swift test 2>&1 | tee ../test.log

      - name: Build
        working-directory: Witthues
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: zsh build-app.sh 2>&1 | tee ../build.log

      - name: Warnings
        run: |
          W=$(grep -h "warning:" build.log test.log | sort -u || true)
          if [ -n "$W" ]; then
            echo "$W" | while read -r line; do echo "::warning::$line"; done
          fi

      - name: Release notes
        run: |
          LAST="${{ steps.version.outputs.last }}"
          RANGE=${LAST:+v$LAST..HEAD}
          git log --no-merges --format='- %s' $RANGE -- Witthues | head -40 > notes.md
          [ -s notes.md ] || echo "- Kleinere Verbesserungen" > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.next }}
        run: |
          cp "Witthues/dist/Witthüs.dmg" Witthues.dmg
          gh release create "v$V" Witthues/dist/Witthues.zip Witthues.dmg \
            --title "Witthüs $V" --notes-file notes.md --target "$GITHUB_SHA"
