<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="600" rx="20" fill="#f5f5f7"/>
<text x="28" y="42" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">Witthüs – so wird eine Rechnung verarbeitet</text>
<text x="28" y="64" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Alles läuft auf dem Mac. Mails werden nur gelesen, nie verändert.</text>
<rect x="28" y="92" width="150" height="128" rx="14" fill="#ffffff" stroke="#0071e3" stroke-width="1.5"/>
<circle cx="48" cy="114" r="11" fill="#0071e3"/>
<text x="48" y="118.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="66" y="120" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="start">Postfach</text>
<text x="42" y="140" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">IMAP über TLS</text>
<text x="42" y="158" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">neue Mails seit</text>
<text x="42" y="176" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">dem letzten Abruf</text>
<text x="42" y="194" font-size="12" font-weight="400" fill="#0071e3" text-anchor="start">alle 5 Min. + Knopf</text>
<line x1="178" y1="156" x2="198" y2="156" stroke="#86868b" stroke-width="2"/>
<path d="M196,151 L204,156 L196,161 z" fill="#86868b"/>
<rect x="204" y="92" width="150" height="128" rx="14" fill="#ffffff" stroke="#0071e3" stroke-width="1.5"/>
<circle cx="224" cy="114" r="11" fill="#0071e3"/>
<text x="224" y="118.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="242" y="120" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="start">Anhänge</text>
<text x="218" y="140" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">MIME zerlegen</text>
<text x="218" y="158" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">nur PDF und XML</text>
<text x="218" y="176" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Duplikate per</text>
<text x="218" y="194" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">SHA-256 erkannt</text>
<line x1="354" y1="156" x2="374" y2="156" stroke="#86868b" stroke-width="2"/>
<path d="M372,151 L380,156 L372,161 z" fill="#86868b"/>
<rect x="380" y="92" width="150" height="128" rx="14" fill="#ffffff" stroke="#0071e3" stroke-width="1.5"/>
<circle cx="400" cy="114" r="11" fill="#0071e3"/>
<text x="400" y="118.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="418" y="120" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="start">Rechnung?</text>
<text x="394" y="140" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">AGB, Angebote,</text>
<text x="394" y="158" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Lieferscheine …</text>
<text x="394" y="176" font-size="12" font-weight="400" fill="#0071e3" text-anchor="start">→ eigene Liste</text>
<line x1="530" y1="156" x2="550" y2="156" stroke="#86868b" stroke-width="2"/>
<path d="M548,151 L556,156 L548,161 z" fill="#86868b"/>
