<path d="M564,117 L572,122 L564,127 z" fill="#86868b"/>
<line x1="556" y1="278" x2="566" y2="278" stroke="#86868b" stroke-width="2"/>
<path d="M564,273 L572,278 L564,283 z" fill="#86868b"/>
<rect x="572" y="84" width="190" height="92" rx="14" fill="#eaf7ee" stroke="#28a745" stroke-width="1.5"/>
<circle cx="592" cy="106" r="11" fill="#28a745"/>
<text x="592" y="110.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4a</text>
<text x="610" y="112" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="start">E-Rechnung</text>
<text x="586" y="132" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">ZUGFeRD · Factur-X</text>
<text x="586" y="150" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">XRechnung (CII / UBL)</text>
<text x="586" y="168" font-size="12" font-weight="600" fill="#1e7e34" text-anchor="start">exakt, ohne KI</text>
<rect x="572" y="202" width="190" height="152" rx="14" fill="#f3eefc" stroke="#8e44ad" stroke-width="1.5"/>
<circle cx="592" cy="224" r="11" fill="#8e44ad"/>
<text x="592" y="228.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4b</text>
<text x="610" y="230" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="start">Sonst: PDF lesen</text>
<text x="586" y="250" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">PDF-Text, bei Scans</text>
<text x="586" y="268" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Apple Vision (OCR)</text>
<text x="586" y="286" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">→ Apple Foundation Models</text>
<text x="586" y="304" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">   auf dem Mac (@Generable)</text>
<text x="586" y="322" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">+ Textregeln in 6 Sprachen</text>
<text x="586" y="340" font-size="12" font-weight="600" fill="#8e44ad" text-anchor="start">prüfen sich gegenseitig</text>
<line x1="762" y1="130" x2="774" y2="130" stroke="#86868b" stroke-width="2"/>
<line x1="762" y1="278" x2="774" y2="278" stroke="#86868b" stroke-width="2"/>
<line x1="774" y1="130" x2="774" y2="278" stroke="#86868b" stroke-width="2"/>
<line x1="774" y1="204" x2="780" y2="204" stroke="#86868b" stroke-width="2"/>
<path d="M778,199 L786,204 L778,209 z" fill="#86868b"/>
<rect x="786" y="112" width="190" height="184" rx="14" fill="#fff6e8" stroke="#f5a623" stroke-width="1.5"/>
<circle cx="806" cy="134" r="11" fill="#f5a623"/>
<text x="806" y="138.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="824" y="140" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="start">Prüfen &amp; ablegen</text>
<text x="800" y="160" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Firma, Nummer,</text>
<text x="800" y="178" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Datum, Betrag</text>
<text x="800" y="196" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">unsicher → „Zu prüfen“</text>
<text x="800" y="214" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Name aus Vorlage</text>
<text x="800" y="232" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Ordner „offen“ →</text>
<text x="800" y="250" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Archiv nach Zahlung</text>
<text x="800" y="268" font-size="12" font-weight="600" fill="#c77700" text-anchor="start">im Hauptordner</text>
<line x1="28" y1="390" x2="972" y2="390" stroke="#d2d2d7"/>
<text x="28" y="412" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="start">Tech-Stack – nur Apple-Frameworks, kein Server, keine Cloud</text>
<text x="28" y="453" font-size="13" font-weight="600" fill="#0071e3" text-anchor="start">Oberfläche</text>
